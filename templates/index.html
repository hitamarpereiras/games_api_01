
<!DOCTYPE html>
<html lang="pt-br">
    <head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Games API</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at top, #1a002e, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        .logo {
            width: 300px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(140, 0, 255, 0.5));
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
            color: #c4b5fd;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .logo {
                width: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="{% static 'logo.png' %}" alt="Space Games Logo" class="logo">

        <h1>Space Games</h1>
        <p>API de gerenciamento de jogos</p>

        <div class="status">
            🚀 API ATIVA
        </div>

        <footer>
            © 2026 Space Games
        </footer>
    </div>

</body>
</html>
